<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>狀態轉換矩陣</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1d5db;
    --yes: #dcfce7;
    --yes-text: #166534;
    --no: #fee2e2;
    --no-text: #991b1b;
    --maybe: #fef9c3;
    --maybe-text: #854d0e;
    --header: #eef2ff;
    --active: #2563eb;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .wrap {
    height: 100vh;
    max-width: 100%;
    margin: 0;
    padding: 8px 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  h1 {
    margin: 0;
    font-size: 18px;
  }

  .hint {
    color: var(--muted);
    margin: 0;
    font-size: 12px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 12px;
  }

  button, select, input {
    font: inherit;
  }

  button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 11px;
  }

  button:hover {
    border-color: var(--active);
  }

  button.primary {
    background: var(--active);
    color: white;
    border-color: var(--active);
  }

  .legend {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .pill {
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--border);
  }

  .pill.yes { background: var(--yes); color: var(--yes-text); }
  .pill.no { background: var(--no); color: var(--no-text); }
  .pill.maybe { background: var(--maybe); color: var(--maybe-text); }

  .workspace {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .table-wrap {
    flex: 1 1 0%;
    min-height: 0;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.02);
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }

  /* Inline Top Tabs Styling */
  .tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #e2e8f0;
    color: #475569;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease-in-out;
    border: 1px solid transparent;
  }

  .tab:hover {
    background: #cbd5e1;
    color: var(--text);
  }

  .tab.active {
    background: var(--active);
    color: white;
    box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
  }

  .tab .tab-edit-btn, .tab .tab-del-btn {
    font-size: 10px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s;
    line-height: 1;
  }

  .tab .tab-edit-btn:hover, .tab .tab-del-btn:hover {
    opacity: 1;
    color: #ef4444;
  }

  .add-tab-btn {
    display: flex;
    align-items: center;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--active);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    box-sizing: border-box;
  }

  .add-tab-btn:hover {
    background: #e0e7ff;
    border-color: var(--active);
  }

  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    height: 100%;
    table-layout: fixed;
  }

  th, td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-align: center;
    padding: 4px;
    box-sizing: border-box;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  th {
    background: var(--header);
    font-weight: 700;
  }

  tbody th {
    text-align: left;
    width: 24%;
    background: var(--header);
    padding: 2px 4px;
    font-size: min(1.8vw, 1.8vh, 12px);
    overflow: visible;
  }

  thead th {
    font-size: min(1.8vw, 1.8vh, 12px);
    background: var(--header);
  }

  thead th.col-header {
    writing-mode: vertical-lr;
    text-align: left;
    padding: 6px 4px;
    font-size: min(1.8vw, 1.8vh, 11px);
    font-weight: 600;
    max-height: 120px;
    height: 120px;
    box-sizing: border-box;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  tr.add-row-tr th {
    background: #f8fafc;
    padding: 2px;
  }
  tr.add-row-tr td {
    background: #f8fafc;
    cursor: default;
  }

  .cell {
    cursor: pointer;
    user-select: none;
    font-size: min(2.5vw, 2.5vh, 18px);
    font-weight: 700;
    transition: transform .08s ease, box-shadow .08s ease;
  }

  .cell:hover {
    box-shadow: inset 0 0 0 2px var(--active);
  }

  .yes {
    background: var(--yes);
    color: var(--yes-text);
  }

  .no {
    background: var(--no);
    color: var(--no-text);
  }

  .maybe {
    background: var(--maybe);
    color: var(--maybe-text);
  }

  .self {
    background: #e5e7eb;
    color: #374151;
  }

  /* Row Header inline editing elements */
  .row-header-container {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 4px;
    position: relative;
    box-sizing: border-box;
  }

  .row-header-input {
    flex: 1;
    min-width: 0;
    border: 1px solid transparent;
    background: transparent;
    font-weight: 700;
    font-size: min(1.8vw, 1.8vh, 12px);
    outline: none;
    padding: 2px 4px;
    border-radius: 4px;
    color: var(--text);
  }

  .row-header-input:focus {
    border-color: var(--active);
    background: #fff;
  }

  .row-header-actions {
    display: flex;
    gap: 1px;
    opacity: 0;
    transition: opacity 0.15s ease-in-out;
  }

  .row-header-container:hover .row-header-actions {
    opacity: 1;
  }

  .row-action-btn {
    padding: 2px;
    font-size: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
  }

  .row-action-btn:hover {
    color: var(--active);
  }

  .row-action-btn.del:hover {
    color: #ef4444;
  }

  .small {
    font-size: 12px;
    color: var(--muted);
  }

  @media print {
    .toolbar, .sidebar, .hint, .team-bar { display: none; }
    body { background: white; }
    .wrap { margin: 0; max-width: none; }
    .table-wrap { box-shadow: none; border-radius: 0; width: 100% !important; }
  }

  /* Team info header bar */
  .team-bar {
    background: #1e293b;
    color: #f3f4f6;
    padding: 8px 16px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .team-bar-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .team-bar-badge {
    background: #10b981;
    color: white;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: bold;
  }
  .team-bar-name {
    font-weight: bold;
    color: #fbbf24;
  }
  .team-bar-link {
    color: #93c5fd;
    text-decoration: none;
    font-size: 13px;
  }
  .team-bar-link:hover {
    text-decoration: underline;
  }

  /* Block overlay when not logged in */
  .block-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.96);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    color: white;
    text-align: center;
  }
  .block-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    margin: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  .block-card h2 {
    color: #ef4444;
    margin-top: 0;
    font-size: 22px;
  }
  .block-card p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .block-card a {
    display: inline-block;
    background: #3b82f6;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s;
  }
  .block-card a:hover {
    background: #2563eb;
  }
</style>
</head>
<body>
<!-- Session Check Block Overlay -->
<div id="session-block" class="block-overlay" style="display: none;">
  <div class="block-card">
    <h2>⚠️ 尚未加入小組</h2>
    <p>您需要先進入傳送門大廳選擇您的小組，才能開始進行狀態轉換矩陣的協作與設定。</p>
    <a href="../index.html">前往大廳選擇小組</a>
  </div>
</div>

<div class="wrap">
  <!-- Team Info Bar -->
  <div id="team-bar-display" class="team-bar" style="display: none;">
    <div class="team-bar-info">
      <span class="team-bar-badge">🟢 已連線</span>
      <span>當前小組：<span id="team-name-span" class="team-bar-name"></span></span>
      <span style="color: #475569;">|</span>
      <span>暱稱：<span id="nickname-span" style="color: #f3f4f6;"></span></span>
    </div>
    <a href="../index.html" class="team-bar-link">返回傳送門首頁 ←</a>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
      <h1 style="margin: 0; font-size: 20px;">狀態轉換矩陣</h1>
      <!-- Tabs container -->
      <div id="tabsList" class="tabs"></div>
      <button onclick="createNewMatrix()" class="add-tab-btn">+ 新增矩陣</button>
    </div>
    <div class="hint" style="margin: 0; font-size: 12px;">
      橫軸代表「目前狀態」，縱軸代表「目標狀態」。點擊單元格切換。
    </div>
  </div>

  <div class="toolbar">
    <button onclick="setAll('no')">全部設為不可觸發</button>
    <button onclick="setAll('maybe')">全部設為待確認</button>
    <button onclick="clearSaved()">清除儲存</button>
    <button onclick="exportCSV()">匯出 CSV</button>
    <button onclick="window.print()">列印 / 存 PDF</button>
    <div class="legend">
      <span class="pill yes">✓ 可觸發</span>
      <span class="pill no">× 不可觸發</span>
      <span class="pill maybe">? 待確認</span>
    </div>
  </div>

  <div class="workspace">
    <!-- Main Table Area (Takes 100% width) -->
    <div class="table-wrap">
      <table id="matrix"></table>
    </div>
  </div>
</div>

<script>
const defaultStatuses = [
  "退回受理人員",
  "暫存",
  "受理人員建檔",
  "受理人員補件",
  "完成受理",
  "退回客戶",
  "駁退",
  "結轉股務",
  "撤件"
];

// Read team session identity
const team = localStorage.getItem("ai_arm_team") || "default_team";
const nickname = localStorage.getItem("ai_arm_nickname") || "Guest";

// Storage configurations
const storageKey = "matrices_" + team;
const currentMatrixKey = "current_matrix_id_" + team;

const defaultMatrices = [
  {
    id: "matrix-default-v2",
    name: "預設狀態矩陣",
    statuses: [...defaultStatuses],
    transitions: {}
  }
];

let matrices = JSON.parse(localStorage.getItem(storageKey) || "null") || defaultMatrices;
let currentMatrixId = localStorage.getItem(currentMatrixKey) || matrices[0].id;

// Migration: Force-remove prefix numbers (e.g. "0. 暫存" -> "暫存") from cached statuses and transitions to solve client-side cached data issues.
let hasMigrated = false;
matrices.forEach(m => {
  m.statuses = m.statuses.map(s => {
    const cleaned = s.replace(/^\d+\.\s*/, "").trim();
    if (cleaned !== s) {
      hasMigrated = true;
      // Rename transitions map keys matching this status
      const updatedTransitions = {};
      Object.keys(m.transitions || {}).forEach(k => {
        let newKey = k;
        const parts = k.split(" -> ");
        if (parts.length === 2) {
          let from = parts[0].replace(/^\d+\.\s*/, "").trim();
          let to = parts[1].replace(/^\d+\.\s*/, "").trim();
          newKey = from + " -> " + to;
        }
        updatedTransitions[newKey] = m.transitions[k];
      });
      m.transitions = updatedTransitions;
    }
    return cleaned;
  });
});

if (hasMigrated) {
  localStorage.setItem(storageKey, JSON.stringify(matrices));
}

// Ensure currentMatrixId exists
if (!matrices.some(m => m.id === currentMatrixId)) {
  currentMatrixId = matrices[0].id;
}

// Track newly added status row for auto-focusing
let focusTarget = null;

function getActiveMatrix() {
  return matrices.find(m => m.id === currentMatrixId) || matrices[0];
}

function key(from, to) {
  return from + " -> " + to;
}

function label(value, from, to) {
  if (from === to) return "—";
  if (value === "yes") return "✓";
  if (value === "maybe") return "?";
  return "×";
}

function nextValue(value) {
  if (value === "no") return "yes";
  if (value === "yes") return "maybe";
  return "no";
}

function saveMatrices() {
  localStorage.setItem(storageKey, JSON.stringify(matrices));
}

function renderMatrixSelector() {
  const container = document.getElementById("tabsList");
  container.innerHTML = "";
  matrices.forEach(m => {
    const tab = document.createElement("div");
    tab.className = "tab" + (m.id === currentMatrixId ? " active" : "");
    tab.onclick = () => switchMatrix(m.id);

    const label = document.createElement("span");
    label.textContent = m.name;
    label.title = "雙擊可重新命名";
    label.ondblclick = (e) => {
      e.stopPropagation();
      renameMatrix(m.id);
    };
    tab.appendChild(label);

    // Edit icon
    const editBtn = document.createElement("span");
    editBtn.className = "tab-edit-btn";
    editBtn.innerHTML = "✏️";
    editBtn.title = "重新命名";
    editBtn.onclick = (e) => {
      e.stopPropagation();
      renameMatrix(m.id);
    };
    tab.appendChild(editBtn);

    // Delete cross button
    if (matrices.length > 1) {
      const delBtn = document.createElement("span");
      delBtn.className = "tab-del-btn";
      delBtn.innerHTML = "&times;";
      delBtn.title = "刪除矩陣";
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteMatrix(m.id);
      };
      tab.appendChild(delBtn);
    }

    container.appendChild(tab);
  });
}

function switchMatrix(id) {
  currentMatrixId = id;
  localStorage.setItem(currentMatrixKey, id);
  renderMatrixSelector();
  render();
}

function createNewMatrix() {
  const name = prompt("請輸入新狀態矩陣的名稱：");
  if (!name || !name.trim()) return;
  const newId = "matrix-" + Date.now();
  matrices.push({
    id: newId,
    name: name.trim(),
    statuses: [...defaultStatuses],
    transitions: {}
  });
  saveMatrices();
  switchMatrix(newId);
}

function renameMatrix(id) {
  const target = matrices.find(m => m.id === id);
  if (!target) return;
  const newName = prompt("請輸入新的矩陣名稱：", target.name);
  if (!newName || !newName.trim()) return;
  target.name = newName.trim();
  saveMatrices();
  renderMatrixSelector();
  render();
}

function deleteMatrix(id) {
  if (matrices.length <= 1) {
    alert("必須至少保留一個矩陣！");
    return;
  }
  const target = matrices.find(m => m.id === id);
  if (!confirm(`確定要刪除狀態矩陣「${target.name}」嗎？此動作無法復原。`)) return;

  matrices = matrices.filter(m => m.id !== id);
  if (currentMatrixId === id) {
    currentMatrixId = matrices[0].id;
    localStorage.setItem(currentMatrixKey, currentMatrixId);
  }
  saveMatrices();
  renderMatrixSelector();
  render();
}

function render() {
  const active = getActiveMatrix();
  const statuses = active.statuses;
  const transitions = active.transitions || {};

  // 1. Render Left Table Matrix
  const table = document.getElementById("matrix");
  table.innerHTML = "";

  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  const corner = document.createElement("th");
  corner.textContent = "目標狀態 ↓ / 目前狀態 →";
  corner.style.width = "24%";
  trh.appendChild(corner);

  statuses.forEach(s => {
    const th = document.createElement("th");
    th.className = "col-header";
    th.textContent = s;
    th.title = s;
    th.style.width = `calc(76% / ${statuses.length})`;
    trh.appendChild(th);
  });

  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  statuses.forEach((to, idx) => {
    const tr = document.createElement("tr");
    
    // Inline Editable Status Header cell
    const th = document.createElement("th");
    const container = document.createElement("div");
    container.className = "row-header-container";
    container.innerHTML = `
      <input type="text" id="input-status-${idx}" class="row-header-input" value="${escapeHtml(to)}" onchange="renameStatus(${idx}, this.value)" />
      <div class="row-header-actions">
        <button class="row-action-btn" onclick="moveStatus(${idx}, -1)" title="上移">▲</button>
        <button class="row-action-btn" onclick="moveStatus(${idx}, 1)" title="下移">▼</button>
        <button class="row-action-btn del" onclick="deleteStatus(${idx})" title="刪除">🗑️</button>
      </div>
    `;
    th.appendChild(container);
    tr.appendChild(th);

    statuses.forEach(from => {
      const td = document.createElement("td");
      const k = key(from, to);
      const value = from === to ? "self" : (transitions[k] || "no");
      td.className = "cell " + value;
      td.textContent = label(value, from, to);
      td.title = `${from} ➔ ${to}: ` + (value === "yes" ? "可觸發" : value === "maybe" ? "待確認" : value === "self" ? "自己" : "不可觸發");

      if (from !== to) {
        td.onclick = () => {
          transitions[k] = nextValue(transitions[k] || "no");
          saveMatrices();
          render();
        };
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  // Append Symmetrical Add Status Row Button at bottom
  const addRowTr = document.createElement("tr");
  addRowTr.className = "add-row-tr";
  const addRowTh = document.createElement("th");
  addRowTh.innerHTML = `
    <button onclick="autoAddStatus()" style="border: 1px dashed var(--border); width: 100%; padding: 4px; text-align: center; border-radius: 6px; font-size: 11px; cursor: pointer; color: var(--active); background: #f8fafc; font-weight: bold;">+ 新增狀態 (Status)</button>
  `;
  addRowTr.appendChild(addRowTh);
  statuses.forEach(() => {
    const td = document.createElement("td");
    addRowTr.appendChild(td);
  });
  tbody.appendChild(addRowTr);

  table.appendChild(tbody);

  // 3. Focus newly created status input
  if (focusTarget !== null) {
    const el = document.getElementById(`input-status-${focusTarget}`);
    if (el) {
      el.focus();
      el.select();
    }
    focusTarget = null;
  }
}

function setAll(value) {
  const active = getActiveMatrix();
  active.statuses.forEach(from => {
    active.statuses.forEach(to => {
      if (from !== to) active.transitions[key(from, to)] = value;
    });
  });
  saveMatrices();
  render();
}

function clearSaved() {
  if (!confirm("確定要重設目前小組的所有矩陣，恢復至單一預設狀態？")) return;
  localStorage.removeItem(storageKey);
  localStorage.removeItem(currentMatrixKey);
  matrices = [
    {
      id: "matrix-default-v2",
      name: "預設狀態矩陣",
      statuses: [...defaultStatuses],
      transitions: {}
    }
  ];
  currentMatrixId = matrices[0].id;
  saveMatrices();
  renderMatrixSelector();
  render();
}

function exportCSV() {
  const active = getActiveMatrix();
  const statuses = active.statuses;
  const transitions = active.transitions || {};

  const rows = [];
  rows.push(["目標狀態 / 目前狀態", ...statuses]);

  statuses.forEach(to => {
    const row = [to];
    statuses.forEach(from => {
      if (from === to) row.push("-");
      else {
        const v = transitions[key(from, to)] || "no";
        row.push(v === "yes" ? "可觸發" : v === "maybe" ? "待確認" : "不可觸發");
      }
    });
    rows.push(row);
  });

  const csv = rows.map(r => r.map(c => '"' + String(c).replaceAll('"', '""') + '"').join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${active.name}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// Add New Status Symmetrically with auto-focusing
function autoAddStatus() {
  const active = getActiveMatrix();
  const list = active.statuses;

  let name = "新狀態";
  let counter = 1;
  while (list.includes(name + counter)) {
    counter++;
  }
  const uniqueName = name + counter;

  list.push(uniqueName);
  focusTarget = list.length - 1;

  saveMatrices();
  render();
}

// Rename Status (preserves transitions!)
function renameStatus(idx, newName) {
  newName = newName.trim();
  const active = getActiveMatrix();
  const oldName = active.statuses[idx];
  if (!newName || newName === oldName) {
    render();
    return;
  }

  if (active.statuses.includes(newName)) {
    alert("狀態名稱不能重複！");
    render();
    return;
  }

  const updatedTransitions = {};
  Object.keys(active.transitions).forEach(k => {
    let newKey = k;
    const parts = k.split(" -> ");
    if (parts.length === 2) {
      let from = parts[0];
      let to = parts[1];
      if (from === oldName) from = newName;
      if (to === oldName) to = newName;
      newKey = key(from, to);
    }
    updatedTransitions[newKey] = active.transitions[k];
  });

  active.statuses[idx] = newName;
  active.transitions = updatedTransitions;
  saveMatrices();
  render();
}

// Move status (reorder)
function moveStatus(idx, direction) {
  const active = getActiveMatrix();
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= active.statuses.length) return;

  const temp = active.statuses[idx];
  active.statuses[idx] = active.statuses[targetIdx];
  active.statuses[targetIdx] = temp;

  saveMatrices();
  render();
}

// Delete status
function deleteStatus(idx) {
  const active = getActiveMatrix();
  if (active.statuses.length <= 1) {
    alert("至少需保留一個狀態！");
    return;
  }
  const deletedName = active.statuses[idx];
  if (!confirm(`確定要刪除狀態「${deletedName}」嗎？相關的轉換設定將會消失。`)) return;

  const updatedTransitions = {};
  Object.keys(active.transitions).forEach(k => {
    const parts = k.split(" -> ");
    if (parts.length === 2) {
      if (parts[0] !== deletedName && parts[1] !== deletedName) {
        updatedTransitions[k] = active.transitions[k];
      }
    }
  });

  active.statuses.splice(idx, 1);
  active.transitions = updatedTransitions;
  saveMatrices();
  render();
}

// Escape HTML utility
function escapeHtml(string) {
  return String(string).replace(/[&<>"']/g, function (s) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[s];
  });
}

// Check Team Session
function checkTeamSession() {
  const teamId = localStorage.getItem("ai_arm_team");
  const nicknameVal = localStorage.getItem("ai_arm_nickname");

  if (!teamId || !nicknameVal) {
    document.getElementById("session-block").style.display = "flex";
    document.getElementById("team-bar-display").style.display = "none";
  } else {
    document.getElementById("session-block").style.display = "none";
    document.getElementById("team-bar-display").style.display = "flex";
    document.getElementById("team-name-span").textContent = translateTeamName(teamId);
    document.getElementById("nickname-span").textContent = nicknameVal;
  }
}

function translateTeamName(t) {
  const map = {
    "Team 1": "第一組 (Team 1)",
    "Team 2": "第二組 (Team 2)",
    "Team 3": "第三組 (Team 3)",
    "Team 4": "第四組 (Team 4)",
    "Team 5": "第五組 (Team 5)",
    "Team 6": "第六組 (Team 6)"
  };
  return map[t] || t;
}

// check session and run initial render

checkTeamSession();
renderMatrixSelector();
render();
