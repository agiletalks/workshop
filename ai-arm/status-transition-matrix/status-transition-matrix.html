<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>狀態轉換矩陣</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1d5db;
    --yes: #dcfce7;
    --yes-text: #166534;
    --no: #fee2e2;
    --no-text: #991b1b;
    --maybe: #fef9c3;
    --maybe-text: #854d0e;
    --header: #eef2ff;
    --active: #2563eb;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .wrap {
    height: 100vh;
    max-width: 100%;
    margin: 0;
    padding: 8px 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  h1 {
    margin: 0;
    font-size: 18px;
  }

  .hint {
    color: var(--muted);
    margin: 0;
    font-size: 12px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 12px;
  }

  button, select, input {
    font: inherit;
  }

  button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 11px;
  }

  button:hover {
    border-color: var(--active);
  }

  button.primary {
    background: var(--active);
    color: white;
    border-color: var(--active);
  }

  .legend {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .pill {
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--border);
  }

  .pill.yes { background: var(--yes); color: var(--yes-text); }
  .pill.no { background: var(--no); color: var(--no-text); }
  .pill.maybe { background: var(--maybe); color: var(--maybe-text); }

  .workspace {
    display: flex;
    gap: 6px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .table-wrap {
    flex: 1 1 0%;
    min-height: 0;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.02);
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }

  .sidebar {
    width: 260px;
    min-width: 260px;
    max-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-sizing: border-box;
  }

  #sidebarToggle:hover {
    background: #94a3b8 !important;
    color: white !important;
  }

  .sidebar-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    box-sizing: border-box;
  }

  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    height: 100%;
    table-layout: fixed;
  }

  th, td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-align: center;
    padding: 4px;
    box-sizing: border-box;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  th {
    background: var(--header);
    font-weight: 700;
  }

  tbody th {
    text-align: left;
    width: 18%;
    background: var(--header);
    padding-left: 6px;
    font-size: min(1.8vw, 1.8vh, 12px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  thead th {
    font-size: min(1.8vw, 1.8vh, 12px);
    background: var(--header);
  }

  thead th.col-header {
    writing-mode: vertical-lr;
    text-align: left;
    padding: 6px 4px;
    font-size: min(1.8vw, 1.8vh, 11px);
    font-weight: 600;
    max-height: 120px;
    height: 120px;
    box-sizing: border-box;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell {
    cursor: pointer;
    user-select: none;
    font-size: min(2.5vw, 2.5vh, 18px);
    font-weight: 700;
    transition: transform .08s ease, box-shadow .08s ease;
  }

  .cell:hover {
    box-shadow: inset 0 0 0 2px var(--active);
  }

  .yes {
    background: var(--yes);
    color: var(--yes-text);
  }

  .no {
    background: var(--no);
    color: var(--no-text);
  }

  .maybe {
    background: var(--maybe);
    color: var(--maybe-text);
  }

  .self {
    background: #e5e7eb;
    color: #374151;
  }

  /* Status list editing items in sidebar */
  .status-item {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 6px;
    background: #f8fafc;
    border: 1px solid var(--border);
    padding: 4px 6px;
    border-radius: 6px;
  }

  .status-item:hover {
    border-color: var(--active);
  }

  .status-item input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: 12px;
    padding: 2px 4px;
    outline: none;
    color: var(--text);
  }

  .status-item button {
    padding: 2px 4px;
    font-size: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }

  .status-item button:hover {
    color: var(--active);
  }

  .small {
    font-size: 12px;
    color: var(--muted);
  }

  @media print {
    .toolbar, .sidebar, .hint, .team-bar { display: none; }
    body { background: white; }
    .wrap { margin: 0; max-width: none; }
    .table-wrap { box-shadow: none; border-radius: 0; width: 100% !important; }
  }

  /* Team info header bar */
  .team-bar {
    background: #1e293b;
    color: #f3f4f6;
    padding: 8px 16px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .team-bar-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .team-bar-badge {
    background: #10b981;
    color: white;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: bold;
  }
  .team-bar-name {
    font-weight: bold;
    color: #fbbf24;
  }
  .team-bar-link {
    color: #93c5fd;
    text-decoration: none;
    font-size: 13px;
  }
  .team-bar-link:hover {
    text-decoration: underline;
  }

  /* Block overlay when not logged in */
  .block-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.96);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    color: white;
    text-align: center;
  }
  .block-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    margin: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  .block-card h2 {
    color: #ef4444;
    margin-top: 0;
    font-size: 22px;
  }
  .block-card p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .block-card a {
    display: inline-block;
    background: #3b82f6;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s;
  }
  .block-card a:hover {
    background: #2563eb;
  }
</style>
</head>
<body>
<!-- Session Check Block Overlay -->
<div id="session-block" class="block-overlay" style="display: none;">
  <div class="block-card">
    <h2>⚠️ 尚未加入小組</h2>
    <p>您需要先進入傳送門大廳選擇您的小組，才能開始進行狀態轉換矩陣的協作與設定。</p>
    <a href="../index.html">前往大廳選擇小組</a>
  </div>
</div>

<div class="wrap">
  <!-- Team Info Bar -->
  <div id="team-bar-display" class="team-bar" style="display: none;">
    <div class="team-bar-info">
      <span class="team-bar-badge">🟢 已連線</span>
      <span>當前小組：<span id="team-name-span" class="team-bar-name"></span></span>
      <span style="color: #475569;">|</span>
      <span>暱稱：<span id="nickname-span" style="color: #f3f4f6;"></span></span>
    </div>
    <a href="../index.html" class="team-bar-link">返回傳送門首頁 ←</a>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
    <h1 style="margin: 0;">狀態轉換矩陣</h1>
    <div class="hint" style="margin: 0; font-size: 12px;">
      橫軸代表「目前狀態」，縱軸代表「目標狀態」。點擊單元格切換。
    </div>
  </div>

  <div class="toolbar">
    <button onclick="setAll('no')">全部設為不可觸發</button>
    <button onclick="setAll('maybe')">全部設為待確認</button>
    <button onclick="clearSaved()">清除儲存</button>
    <button onclick="exportCSV()">匯出 CSV</button>
    <button onclick="window.print()">列印 / 存 PDF</button>
    <div class="legend">
      <span class="pill yes">✓ 可觸發</span>
      <span class="pill no">× 不可觸發</span>
      <span class="pill maybe">? 待確認</span>
    </div>
  </div>

  <div class="workspace">
    <!-- Left Side: Sidebar Controls -->
    <div id="sidebarContainer" class="sidebar">
      <!-- Matrix Switching Card -->
      <div class="sidebar-card">
        <h4 style="margin: 0 0 6px; font-size: 12px; color: var(--text);">📋 矩陣管理</h4>
        <div style="display: flex; gap: 4px; margin-bottom: 6px;">
          <select id="matrixSelector" onchange="switchMatrix(this.value)" style="flex: 1; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; outline: none; background: #fff;"></select>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;">
          <button onclick="createNewMatrix()" class="primary" style="padding: 4px 0; font-size: 11px;">+ 新增</button>
          <button onclick="renameCurrentMatrix()" style="padding: 4px 0; font-size: 11px;">✏️ 命名</button>
          <button onclick="deleteCurrentMatrix()" style="padding: 4px 0; font-size: 11px; color: var(--no-text); border-color: rgba(239, 68, 68, 0.3);" class="btn-danger">🗑️ 刪除</button>
        </div>
      </div>

      <!-- Status Editing Card -->
      <div class="sidebar-card" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
        <h4 style="margin: 0 0 6px; font-size: 12px; color: var(--text);">⚙️ 狀態清單編輯器</h4>
        
        <!-- Add Status -->
        <div style="display: flex; gap: 4px; margin-bottom: 8px;">
          <input type="text" id="newStatusInput" placeholder="新增狀態..." onkeydown="if(event.key==='Enter') addStatus()" style="flex: 1; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; outline: none;" />
          <button onclick="addStatus()" class="primary" style="padding: 4px 8px; font-size: 12px;">+</button>
        </div>

        <!-- Scrollable List of Statuses -->
        <div id="statusesList" style="flex: 1; overflow-y: auto; padding-right: 2px;">
          <!-- Items will be injected dynamically -->
        </div>
      </div>
    </div>

    <!-- Collapsible Toggle Bar -->
    <div id="sidebarToggle" onclick="toggleSidebar()" style="width: 12px; min-width: 12px; cursor: pointer; background: #cbd5e1; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 10px; color: #475569; user-select: none; transition: background 0.2s;" title="收合側邊欄">◀</div>

    <!-- Right Side: Table Area -->
    <div class="table-wrap">
      <table id="matrix"></table>
    </div>
  </div>
</div>

<script>
const defaultStatuses = [
  "退回受理人員",
  "暫存",
  "受理人員建檔",
  "受理人員補件",
  "完成受理",
  "退回客戶",
  "駁退",
  "結轉股務",
  "撤件"
];

// Read team session identity
const team = localStorage.getItem("ai_arm_team") || "default_team";
const nickname = localStorage.getItem("ai_arm_nickname") || "Guest";

// Storage configurations
const storageKey = "matrices_" + team;
const currentMatrixKey = "current_matrix_id_" + team;

const defaultMatrices = [
  {
    id: "matrix-default-v2",
    name: "預設狀態矩陣",
    statuses: [...defaultStatuses],
    transitions: {}
  }
];

let matrices = JSON.parse(localStorage.getItem(storageKey) || "null") || defaultMatrices;
let currentMatrixId = localStorage.getItem(currentMatrixKey) || matrices[0].id;

// Migration: Force-remove prefix numbers (e.g. "0. 暫存" -> "暫存") from cached statuses and transitions to solve client-side cached data issues.
let hasMigrated = false;
matrices.forEach(m => {
  m.statuses = m.statuses.map(s => {
    const cleaned = s.replace(/^\d+\.\s*/, "").trim();
    if (cleaned !== s) {
      hasMigrated = true;
      // Rename transitions map keys matching this status
      const updatedTransitions = {};
      Object.keys(m.transitions || {}).forEach(k => {
        let newKey = k;
        const parts = k.split(" -> ");
        if (parts.length === 2) {
          let from = parts[0].replace(/^\d+\.\s*/, "").trim();
          let to = parts[1].replace(/^\d+\.\s*/, "").trim();
          newKey = from + " -> " + to;
        }
        updatedTransitions[newKey] = m.transitions[k];
      });
      m.transitions = updatedTransitions;
    }
    return cleaned;
  });
});

if (hasMigrated) {
  localStorage.setItem(storageKey, JSON.stringify(matrices));
}

// Ensure currentMatrixId exists
if (!matrices.some(m => m.id === currentMatrixId)) {
  currentMatrixId = matrices[0].id;
}

function getActiveMatrix() {
  return matrices.find(m => m.id === currentMatrixId) || matrices[0];
}

function key(from, to) {
  return from + " -> " + to;
}

function label(value, from, to) {
  if (from === to) return "—";
  if (value === "yes") return "✓";
  if (value === "maybe") return "?";
  return "×";
}

function nextValue(value) {
  if (value === "no") return "yes";
  if (value === "yes") return "maybe";
  return "no";
}

function saveMatrices() {
  localStorage.setItem(storageKey, JSON.stringify(matrices));
}

function renderMatrixSelector() {
  const selector = document.getElementById("matrixSelector");
  selector.innerHTML = "";
  matrices.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.name;
    if (m.id === currentMatrixId) opt.selected = true;
    selector.appendChild(opt);
  });
}

function switchMatrix(id) {
  currentMatrixId = id;
  localStorage.setItem(currentMatrixKey, id);
  renderMatrixSelector();
  render();
}

function createNewMatrix() {
  const name = prompt("請輸入新矩陣的名稱：");
  if (!name || !name.trim()) return;
  const newId = "matrix-" + Date.now();
  matrices.push({
    id: newId,
    name: name.trim(),
    statuses: [...defaultStatuses],
    transitions: {}
  });
  saveMatrices();
  switchMatrix(newId);
}

function renameCurrentMatrix() {
  const active = getActiveMatrix();
  const newName = prompt("請輸入新的矩陣名稱：", active.name);
  if (!newName || !newName.trim()) return;
  active.name = newName.trim();
  saveMatrices();
  renderMatrixSelector();
}

function deleteCurrentMatrix() {
  if (matrices.length <= 1) {
    alert("必須至少保留一個矩陣！");
    return;
  }
  const active = getActiveMatrix();
  if (!confirm(`確定要刪除矩陣「${active.name}」嗎？此動作無法復原。`)) return;
  
  matrices = matrices.filter(m => m.id !== currentMatrixId);
  currentMatrixId = matrices[0].id;
  localStorage.setItem(currentMatrixKey, currentMatrixId);
  saveMatrices();
  renderMatrixSelector();
  render();
}

function render() {
  const active = getActiveMatrix();
  const statuses = active.statuses;
  const transitions = active.transitions || {};

  // 1. Render Left Table Matrix
  const table = document.getElementById("matrix");
  table.innerHTML = "";

  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  const corner = document.createElement("th");
  corner.textContent = "目標狀態 ↓ / 目前狀態 →";
  corner.style.width = "18%";
  trh.appendChild(corner);

  statuses.forEach(s => {
    const th = document.createElement("th");
    th.className = "col-header";
    th.textContent = s;
    th.title = s;
    th.style.width = `calc(82% / ${statuses.length})`;
    trh.appendChild(th);
  });

  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  statuses.forEach(to => {
    const tr = document.createElement("tr");
    const rowHead = document.createElement("th");
    rowHead.textContent = to;
    rowHead.title = to;
    tr.appendChild(rowHead);

    statuses.forEach(from => {
      const td = document.createElement("td");
      const k = key(from, to);
      const value = from === to ? "self" : (transitions[k] || "no");
      td.className = "cell " + value;
      td.textContent = label(value, from, to);
      td.title = `${from} ➔ ${to}: ` + (value === "yes" ? "可觸發" : value === "maybe" ? "待確認" : value === "self" ? "自己" : "不可觸發");

      if (from !== to) {
        td.onclick = () => {
          transitions[k] = nextValue(transitions[k] || "no");
          saveMatrices();
          render();
        };
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);

  // 2. Render Right Status Sidebar List
  const listContainer = document.getElementById("statusesList");
  listContainer.innerHTML = "";
  statuses.forEach((s, idx) => {
    const item = document.createElement("div");
    item.className = "status-item";
    item.innerHTML = `
      <input type="text" value="${escapeHtml(s)}" onchange="renameStatus(${idx}, this.value)" />
      <button onclick="moveStatus(${idx}, -1)" title="上移">▲</button>
      <button onclick="moveStatus(${idx}, 1)" title="下移">▼</button>
      <button onclick="deleteStatus(${idx})" title="刪除">🗑️</button>
    `;
    listContainer.appendChild(item);
  });
}

function setAll(value) {
  const active = getActiveMatrix();
  active.statuses.forEach(from => {
    active.statuses.forEach(to => {
      if (from !== to) active.transitions[key(from, to)] = value;
    });
  });
  saveMatrices();
  render();
}

function clearSaved() {
  if (!confirm("確定要重設目前小組的所有矩陣，恢復至單一預設狀態？")) return;
  localStorage.removeItem(storageKey);
  localStorage.removeItem(currentMatrixKey);
  matrices = [
    {
      id: "matrix-default",
      name: "預設狀態矩陣",
      statuses: [...defaultStatuses],
      transitions: {}
    }
  ];
  currentMatrixId = matrices[0].id;
  saveMatrices();
  renderMatrixSelector();
  render();
}

function exportCSV() {
  const active = getActiveMatrix();
  const statuses = active.statuses;
  const transitions = active.transitions || {};

  const rows = [];
  rows.push(["目標狀態 / 目前狀態", ...statuses]);

  statuses.forEach(to => {
    const row = [to];
    statuses.forEach(from => {
      if (from === to) row.push("-");
      else {
        const v = transitions[key(from, to)] || "no";
        row.push(v === "yes" ? "可觸發" : v === "maybe" ? "待確認" : "不可觸發");
      }
    });
    rows.push(row);
  });

  const csv = rows.map(r => r.map(c => '"' + String(c).replaceAll('"', '""') + '"').join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${active.name}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// Add New Status
function addStatus() {
  const input = document.getElementById("newStatusInput");
  const name = input.value.trim();
  if (!name) return;
  const active = getActiveMatrix();

  if (active.statuses.includes(name)) {
    alert("狀態名稱不能重複！");
    return;
  }

  active.statuses.push(name);
  saveMatrices();
  input.value = "";
  render();
}

// Rename Status (preserves transitions!)
function renameStatus(idx, newName) {
  newName = newName.trim();
  const active = getActiveMatrix();
  const oldName = active.statuses[idx];
  if (!newName || newName === oldName) {
    render();
    return;
  }

  if (active.statuses.includes(newName)) {
    alert("狀態名稱不能重複！");
    render();
    return;
  }

  const updatedTransitions = {};
  Object.keys(active.transitions).forEach(k => {
    let newKey = k;
    const parts = k.split(" -> ");
    if (parts.length === 2) {
      let from = parts[0];
      let to = parts[1];
      if (from === oldName) from = newName;
      if (to === oldName) to = newName;
      newKey = key(from, to);
    }
    updatedTransitions[newKey] = active.transitions[k];
  });

  active.statuses[idx] = newName;
  active.transitions = updatedTransitions;
  saveMatrices();
  render();
}

// Move status (reorder)
function moveStatus(idx, direction) {
  const active = getActiveMatrix();
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= active.statuses.length) return;

  const temp = active.statuses[idx];
  active.statuses[idx] = active.statuses[targetIdx];
  active.statuses[targetIdx] = temp;

  saveMatrices();
  render();
}

// Delete status
function deleteStatus(idx) {
  const active = getActiveMatrix();
  if (active.statuses.length <= 1) {
    alert("至少需保留一個狀態！");
    return;
  }
  const deletedName = active.statuses[idx];
  if (!confirm(`確定要刪除狀態「${deletedName}」嗎？相關的轉換設定將會消失。`)) return;

  const updatedTransitions = {};
  Object.keys(active.transitions).forEach(k => {
    const parts = k.split(" -> ");
    if (parts.length === 2) {
      if (parts[0] !== deletedName && parts[1] !== deletedName) {
        updatedTransitions[k] = active.transitions[k];
      }
    }
  });

  active.statuses.splice(idx, 1);
  active.transitions = updatedTransitions;
  saveMatrices();
  render();
}

// Escape HTML utility
function escapeHtml(string) {
  return String(string).replace(/[&<>"']/g, function (s) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[s];
  });
}

// Check Team Session
function checkTeamSession() {
  const teamId = localStorage.getItem("ai_arm_team");
  const nicknameVal = localStorage.getItem("ai_arm_nickname");

  if (!teamId || !nicknameVal) {
    document.getElementById("session-block").style.display = "flex";
    document.getElementById("team-bar-display").style.display = "none";
  } else {
    document.getElementById("session-block").style.display = "none";
    document.getElementById("team-bar-display").style.display = "flex";
    document.getElementById("team-name-span").textContent = translateTeamName(teamId);
    document.getElementById("nickname-span").textContent = nicknameVal;
  }
}

function translateTeamName(t) {
  const map = {
    "Team 1": "第一組 (Team 1)",
    "Team 2": "第二組 (Team 2)",
    "Team 3": "第三組 (Team 3)",
    "Team 4": "第四組 (Team 4)",
    "Team 5": "第五組 (Team 5)",
    "Team 6": "第六組 (Team 6)"
  };
  return map[t] || t;
}

let sidebarCollapsed = false;
function toggleSidebar() {
  const sidebar = document.getElementById("sidebarContainer");
  const toggle = document.getElementById("sidebarToggle");
  sidebarCollapsed = !sidebarCollapsed;
  if (sidebarCollapsed) {
    sidebar.style.display = "none";
    toggle.textContent = "▶";
    toggle.title = "展開側邊欄";
  } else {
    sidebar.style.display = "flex";
    toggle.textContent = "◀";
    toggle.title = "收合側邊欄";
  }
  // Re-render table to adjust cells to new layout size
  render();
}

checkTeamSession();
renderMatrixSelector();
render();
</script>
