<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>狀態轉換矩陣</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1d5db;
    --yes: #dcfce7;
    --yes-text: #166534;
    --no: #fee2e2;
    --no-text: #991b1b;
    --maybe: #fef9c3;
    --maybe-text: #854d0e;
    --header: #eef2ff;
    --active: #2563eb;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .wrap {
    height: 100vh;
    max-width: 100%;
    margin: 0;
    padding: 12px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  h1 {
    margin: 0;
    font-size: 20px;
  }

  .hint {
    color: var(--muted);
    margin: 0;
    font-size: 13px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  button, select, input {
    font: inherit;
  }

  button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
  }

  button:hover {
    border-color: var(--active);
  }

  button.primary {
    background: var(--active);
    color: white;
    border-color: var(--active);
  }

  .legend {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .pill {
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--border);
  }

  .pill.yes { background: var(--yes); color: var(--yes-text); }
  .pill.no { background: var(--no); color: var(--no-text); }
  .pill.maybe { background: var(--maybe); color: var(--maybe-text); }

  .table-wrap {
    flex: 1 1 0%;
    min-height: 0;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.02);
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }

  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    height: 100%;
    table-layout: fixed;
  }

  th, td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-align: center;
    padding: 4px;
    box-sizing: border-box;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  th {
    background: var(--header);
    font-weight: 700;
  }

  tbody th {
    text-align: left;
    width: 18%;
    background: var(--header);
    padding-left: 6px;
    font-size: min(1.8vw, 1.8vh, 13px);
  }

  thead th {
    font-size: min(1.8vw, 1.8vh, 13px);
  }

  .cell {
    cursor: pointer;
    user-select: none;
    font-size: min(2.5vw, 2.5vh, 18px);
    font-weight: 700;
    transition: transform .08s ease, box-shadow .08s ease;
  }

  .cell:hover {
    box-shadow: inset 0 0 0 2px var(--active);
  }

  .yes {
    background: var(--yes);
    color: var(--yes-text);
  }

  .no {
    background: var(--no);
    color: var(--no-text);
  }

  .maybe {
    background: var(--maybe);
    color: var(--maybe-text);
  }

  .self {
    background: #e5e7eb;
    color: #374151;
  }

  .panel {
    margin-top: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }

  textarea {
    width: 100%;
    min-height: 48px;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    box-sizing: border-box;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .small {
    font-size: 12px;
    color: var(--muted);
  }

  @media print {
    .toolbar, .panel, .hint, .team-bar { display: none; }
    body { background: white; }
    .wrap { margin: 0; max-width: none; }
    .table-wrap { box-shadow: none; border-radius: 0; }
  }

  /* Team info header bar */
  .team-bar {
    background: #1e293b;
    color: #f3f4f6;
    padding: 10px 20px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .team-bar-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .team-bar-badge {
    background: #10b981;
    color: white;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: bold;
  }
  .team-bar-name {
    font-weight: bold;
    color: #fbbf24;
  }
  .team-bar-link {
    color: #93c5fd;
    text-decoration: none;
    font-size: 13px;
  }
  .team-bar-link:hover {
    text-decoration: underline;
  }

  /* Block overlay when not logged in */
  .block-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.96);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    color: white;
    text-align: center;
  }
  .block-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    margin: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  .block-card h2 {
    color: #ef4444;
    margin-top: 0;
    font-size: 22px;
  }
  .block-card p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .block-card a {
    display: inline-block;
    background: #3b82f6;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s;
  }
  .block-card a:hover {
    background: #2563eb;
  }
</style>
</head>
<body>
<!-- Session Check Block Overlay -->
<div id="session-block" class="block-overlay" style="display: none;">
  <div class="block-card">
    <h2>⚠️ 尚未加入小組</h2>
    <p>您需要先進入傳送門大廳選擇您的小組，才能開始進行狀態轉換矩陣的協作與設定。</p>
    <a href="../index.html">前往大廳選擇小組</a>
  </div>
</div>

<div class="wrap">
  <!-- Team Info Bar -->
  <div id="team-bar-display" class="team-bar" style="display: none;">
    <div class="team-bar-info">
      <span class="team-bar-badge">🟢 已連線</span>
      <span>當前小組：<span id="team-name-span" class="team-bar-name"></span></span>
      <span style="color: #475569;">|</span>
      <span>暱稱：<span id="nickname-span" style="color: #f3f4f6;"></span></span>
    </div>
    <a href="../index.html" class="team-bar-link">返回傳送門首頁 ←</a>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
    <h1 style="margin: 0;">狀態轉換矩陣</h1>
    <div class="hint" style="margin: 0; font-size: 13px;">
      橫軸代表「目前狀態」，縱軸代表「目標狀態」。點擊單元格切換。
    </div>
  </div>

  <div class="toolbar">
    <div class="matrix-select-wrap" style="display: flex; align-items: center; gap: 6px; margin-right: 12px; border-right: 1px solid var(--border); padding-right: 12px;">
      <span style="font-weight: bold; color: var(--text);">選擇矩陣：</span>
      <select id="matrixSelector" onchange="switchMatrix(this.value)" style="padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; outline: none;"></select>
      <button onclick="createNewMatrix()" class="primary" style="padding: 4px 8px; font-size: 12px; border-radius: 6px;">+ 新增</button>
      <button onclick="renameCurrentMatrix()" style="padding: 4px 8px; font-size: 12px; border-radius: 6px;">✏️ 命名</button>
      <button onclick="deleteCurrentMatrix()" style="padding: 4px 8px; font-size: 12px; border-radius: 6px; color: var(--no-text); border-color: rgba(239, 68, 68, 0.3);" class="btn-danger">🗑️ 刪除</button>
    </div>
    
    <button onclick="setAll('no')" style="padding: 4px 8px; font-size: 12px; border-radius: 6px;">全部設為不可觸發</button>
    <button onclick="setAll('maybe')" style="padding: 4px 8px; font-size: 12px; border-radius: 6px;">全部設為待確認</button>
    <button onclick="clearSaved()" style="padding: 4px 8px; font-size: 12px; border-radius: 6px;">清除儲存</button>
    <button onclick="exportCSV()" style="padding: 4px 8px; font-size: 12px; border-radius: 6px;">匯出 CSV</button>
    <button onclick="window.print()" style="padding: 4px 8px; font-size: 12px; border-radius: 6px;">列印 / 存 PDF</button>
    <div class="legend">
      <span class="pill yes" style="padding: 3px 8px; font-size: 11px;">✓ 可觸發</span>
      <span class="pill no" style="padding: 3px 8px; font-size: 11px;">× 不可觸發</span>
      <span class="pill maybe" style="padding: 3px 8px; font-size: 11px;">? 待確認</span>
    </div>
  </div>

  <div class="table-wrap">
    <table id="matrix"></table>
  </div>

  <div class="panel">
    <div style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none;" onclick="toggleConfigPanel()">
      <h3 style="margin: 0; font-size: 13px; display: flex; align-items: center; gap: 4px;">
        ⚙️ 狀態清單編輯器 <span id="panelToggleArrow" style="font-size: 10px; color: var(--muted); font-weight: normal;">▲ 折疊</span>
      </h3>
      <span class="small" style="margin: 0; font-size: 12px;">一行一個狀態，修改後重建表格。系統會保留相同狀態名稱的既有設定。</span>
    </div>
    <div id="panelContent" style="display: block; margin-top: 6px;">
      <textarea id="statusInput" style="min-height: 48px; height: 50px; font-size: 12px; padding: 6px; margin-bottom: 4px;"></textarea>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="primary" onclick="rebuildFromInput()" style="padding: 4px 10px; font-size: 12px; border-radius: 6px;">重建表格</button>
      </div>
    </div>
  </div>
</div>

<script>
const defaultStatuses = [
  "0. 退回受理人員",
  "1. 暫存",
  "2. 受理人員建檔",
  "3. 受理人員補件",
  "4. 完成受理",
  "5. 退回客戶",
  "6. 駁退",
  "7. 結轉股務",
  "9. 撤件"
];

// Read team session identity
const team = localStorage.getItem("ai_arm_team") || "default_team";
const nickname = localStorage.getItem("ai_arm_nickname") || "Guest";

// Storage configurations
const storageKey = "matrices_" + team;
const currentMatrixKey = "current_matrix_id_" + team;

const defaultMatrices = [
  {
    id: "matrix-default",
    name: "預設狀態矩陣",
    statuses: [...defaultStatuses],
    transitions: {}
  }
];

let matrices = JSON.parse(localStorage.getItem(storageKey) || "null") || defaultMatrices;
let currentMatrixId = localStorage.getItem(currentMatrixKey) || matrices[0].id;

// Ensure currentMatrixId exists
if (!matrices.some(m => m.id === currentMatrixId)) {
  currentMatrixId = matrices[0].id;
}

function getActiveMatrix() {
  return matrices.find(m => m.id === currentMatrixId) || matrices[0];
}

function key(from, to) {
  return from + " -> " + to;
}

function label(value, from, to) {
  if (from === to) return "—";
  if (value === "yes") return "✓";
  if (value === "maybe") return "?";
  return "×";
}

function nextValue(value) {
  if (value === "no") return "yes";
  if (value === "yes") return "maybe";
  return "no";
}

function saveMatrices() {
  localStorage.setItem(storageKey, JSON.stringify(matrices));
}

function renderMatrixSelector() {
  const selector = document.getElementById("matrixSelector");
  selector.innerHTML = "";
  matrices.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.name;
    if (m.id === currentMatrixId) opt.selected = true;
    selector.appendChild(opt);
  });
}

function switchMatrix(id) {
  currentMatrixId = id;
  localStorage.setItem(currentMatrixKey, id);
  renderMatrixSelector();
  render();
}

function createNewMatrix() {
  const name = prompt("請輸入新矩陣的名稱：");
  if (!name || !name.trim()) return;
  const newId = "matrix-" + Date.now();
  matrices.push({
    id: newId,
    name: name.trim(),
    statuses: [...defaultStatuses],
    transitions: {}
  });
  saveMatrices();
  switchMatrix(newId);
}

function renameCurrentMatrix() {
  const active = getActiveMatrix();
  const newName = prompt("請輸入新的矩陣名稱：", active.name);
  if (!newName || !newName.trim()) return;
  active.name = newName.trim();
  saveMatrices();
  renderMatrixSelector();
}

function deleteCurrentMatrix() {
  if (matrices.length <= 1) {
    alert("必須至少保留一個矩陣！");
    return;
  }
  const active = getActiveMatrix();
  if (!confirm(`確定要刪除矩陣「${active.name}」嗎？此動作無法復原。`)) return;
  
  matrices = matrices.filter(m => m.id !== currentMatrixId);
  currentMatrixId = matrices[0].id;
  localStorage.setItem(currentMatrixKey, currentMatrixId);
  saveMatrices();
  renderMatrixSelector();
  render();
}

function render() {
  const active = getActiveMatrix();
  const statuses = active.statuses;
  const transitions = active.transitions || {};

  document.getElementById("statusInput").value = statuses.join("\n");
  const table = document.getElementById("matrix");
  table.innerHTML = "";

  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  const corner = document.createElement("th");
  corner.textContent = "目標狀態 ↓ / 目前狀態 →";
  corner.style.width = "18%";
  trh.appendChild(corner);

  statuses.forEach((s, idx) => {
    const th = document.createElement("th");
    th.textContent = idx;
    th.title = s;
    th.style.width = `calc(82% / ${statuses.length})`;
    th.style.cursor = "help";
    trh.appendChild(th);
  });

  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  statuses.forEach(to => {
    const tr = document.createElement("tr");
    const rowHead = document.createElement("th");
    rowHead.textContent = to;
    rowHead.title = to;
    tr.appendChild(rowHead);

    statuses.forEach(from => {
      const td = document.createElement("td");
      const k = key(from, to);
      const value = from === to ? "self" : (transitions[k] || "no");
      td.className = "cell " + value;
      td.textContent = label(value, from, to);
      td.title = `${from} ➔ ${to}: ` + (value === "yes" ? "可觸發" : value === "maybe" ? "待確認" : value === "self" ? "自己" : "不可觸發");

      if (from !== to) {
        td.onclick = () => {
          transitions[k] = nextValue(transitions[k] || "no");
          saveMatrices();
          render();
        };
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
}

function setAll(value) {
  const active = getActiveMatrix();
  active.statuses.forEach(from => {
    active.statuses.forEach(to => {
      if (from !== to) active.transitions[key(from, to)] = value;
    });
  });
  saveMatrices();
  render();
}

function rebuildFromInput() {
  const active = getActiveMatrix();
  const nextStatuses = document.getElementById("statusInput").value
    .split("\n")
    .map(s => s.trim())
    .filter(Boolean);

  if (nextStatuses.length === 0) {
    alert("請至少保留一個狀態。");
    return;
  }

  active.statuses = nextStatuses;
  saveMatrices();
  render();
}

function clearSaved() {
  if (!confirm("確定要重設目前小組的所有矩陣，恢復至單一預設狀態？")) return;
  localStorage.removeItem(storageKey);
  localStorage.removeItem(currentMatrixKey);
  matrices = [
    {
      id: "matrix-default",
      name: "預設狀態矩陣",
      statuses: [...defaultStatuses],
      transitions: {}
    }
  ];
  currentMatrixId = matrices[0].id;
  saveMatrices();
  renderMatrixSelector();
  render();
}

function exportCSV() {
  const active = getActiveMatrix();
  const statuses = active.statuses;
  const transitions = active.transitions || {};

  const rows = [];
  rows.push(["目標狀態 / 目前狀態", ...statuses]);

  statuses.forEach(to => {
    const row = [to];
    statuses.forEach(from => {
      if (from === to) row.push("-");
      else {
        const v = transitions[key(from, to)] || "no";
        row.push(v === "yes" ? "可觸發" : v === "maybe" ? "待確認" : "不可觸發");
      }
    });
    rows.push(row);
  });

  const csv = rows.map(r => r.map(c => '"' + String(c).replaceAll('"', '""') + '"').join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${active.name}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function toggleConfigPanel() {
  const content = document.getElementById("panelContent");
  const arrow = document.getElementById("panelToggleArrow");
  if (content.style.display === "none") {
    content.style.display = "block";
    arrow.textContent = "▲ 折疊";
  } else {
    content.style.display = "none";
    arrow.textContent = "▼ 展開";
  }
}

// Check Team Session
function checkTeamSession() {
  const teamId = localStorage.getItem("ai_arm_team");
  const nicknameVal = localStorage.getItem("ai_arm_nickname");

  if (!teamId || !nicknameVal) {
    document.getElementById("session-block").style.display = "flex";
    document.getElementById("team-bar-display").style.display = "none";
  } else {
    document.getElementById("session-block").style.display = "none";
    document.getElementById("team-bar-display").style.display = "flex";
    document.getElementById("team-name-span").textContent = translateTeamName(teamId);
    document.getElementById("nickname-span").textContent = nicknameVal;
  }
}

function translateTeamName(t) {
  const map = {
    "Team 1": "第一組 (Team 1)",
    "Team 2": "第二組 (Team 2)",
    "Team 3": "第三組 (Team 3)",
    "Team 4": "第四組 (Team 4)",
    "Team 5": "第五組 (Team 5)",
    "Team 6": "第六組 (Team 6)"
  };
  return map[t] || t;
}

checkTeamSession();
renderMatrixSelector();
render();
</script>
</body>
</html>
